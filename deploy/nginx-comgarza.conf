# Referencia de configuración Nginx para comgarza.com (aplicar en el VPS)
server {
    listen 443 ssl http2;
    server_name comgarza.com www.comgarza.com;
    root /var/www/garza_crm_page/frontend_page/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location /api/     { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /uploads/ { proxy_pass http://127.0.0.1:5000; }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    # Archivos estáticos reales: 404 genuino si no existen
    location ~* \.(?:txt|xml|html|png|jpg|jpeg|webp|svg|ico|css|js|json)$ { try_files $uri =404; }

    # Rutas conocidas del SPA -> index.html con 200; cualquier otra -> 404 real
    location ~ ^/(suministro|nosotros|catalogo|contacto)/?$ { try_files /index.html =404; }
    location = / { try_files /index.html =404; }

    error_page 404 /index.html;
}

server {
    listen 80;
    server_name comgarza.com www.comgarza.com;
    return 301 https://comgarza.com$request_uri;
}
